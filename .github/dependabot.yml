# Wekelijkse voorstellen voor alle vastgezette afhankelijkheden. Kleine updates komen per
# ecosysteem in één pull request; een nieuwe hoofdversie krijgt een eigen pull request.
# Een nieuwe versie wordt pas na een week voorgesteld (cooldown), zodat een overgenomen release
# meestal al is ontdekt en ingetrokken voordat hij hier binnenkomt (issue #54).
# Niet gedekt, en dus met de hand bij te werken: de images van BuildKit, binfmt en Grype in
# .github/workflows/ci.yml, en backend/build-requirements.txt.
version: 2
updates:
  # uv updates pyproject.toml and the lock with every indirect package (backend/uv.lock).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # OAK stays on Python 3.13 (CLAUDE.md): only 3.13.x updates for the python image. The
      # workflow python-next.yml tests the backend on newer versions every week.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
