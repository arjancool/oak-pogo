# Controles voor iedere push en pull request: backend, frontend, end-to-end en de Docker-build
# met beveiligingscontroles. Iedere maandag draait alles opnieuw, zodat een nieuw bekend lek in
# een ongewijzigde image ook opvalt.
#
# Publiceren gebeurt in dezelfde run, pas als alle controles voor die commit zijn geslaagd:
#   push naar main      → latest, sha-<kort>
#   tag v2.1.0          → 2.1.0, 2.1, sha-<kort>
#   handmatig (main/tag) → dezelfde tags, na dezelfde controles
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never stop a run on main or a tag halfway: it may be publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend (ruff, pyright, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Afhankelijkheden installeren
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Pyright
        run: .venv/bin/pyright
      - name: Pytest
        run: .venv/bin/pytest

  frontend:
    name: Frontend (lint, typecheck, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Bekende kwetsbaarheden in npm-pakketten
        # Also the development tools: they run on developer machines and in CI. Fails on high
        # and critical advisories; the weekly run catches new ones in unchanged code.
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend installeren
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      - name: Frontend installeren en bouwen
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image bouwen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: oak-pogo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starten en gezondheid controleren
        run: |
          mkdir -p "$RUNNER_TEMP/oak-data"
          docker run -d --name oak-ci -p 8080:8080 \
            -e OAK_GAMEDATA_AUTO_UPDATE=false \
            -e OAK_EVENTS_AUTO_UPDATE=false \
            -v "$RUNNER_TEMP/oak-data:/data" oak-pogo:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' oak-ci)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          docker logs oak-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' oak-ci)" = "healthy"
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - name: Beveiliging van de draaiende container
        run: scripts/ci_security_checks.sh oak-ci oak-pogo:ci http://127.0.0.1:8080
      - name: Image scannen op bekende kwetsbaarheden
        # Grype from Anchore, pinned to a digest rather than a tag that can be moved. The image
        # goes in as an archive, so the scanner gets no access to the Docker socket. Fails on a
        # high or critical vulnerability for which a fixed version exists.
        run: |
          docker save oak-pogo:ci -o "$RUNNER_TEMP/oak-image.tar"
          docker run --rm -v "$RUNNER_TEMP/oak-image.tar:/image.tar:ro" \
            ghcr.io/anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea \
            docker-archive:/image.tar --only-fixed --fail-on high

  release:
    name: Image publiceren
    runs-on: ubuntu-24.04
    # Only the commit that just passed every check, and only from main or a version tag.
    needs: [backend, frontend, e2e, docker]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags en labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=OAK
            org.opencontainers.image.licenses=Apache-2.0
      - name: Bouwen en publiceren
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OAK_VERSION=${{ steps.meta.outputs.version }}
            OAK_BUILD_SHA=${{ github.sha }}
            OAK_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            OAK_BUILD_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
