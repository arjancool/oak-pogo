# Used for `alembic revision --autogenerate` during development. The application runs
# migrations itself at startup (app/core/migrations.py) against OAK_DATA_DIR/oak.db.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./.oak-dev/oak.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
